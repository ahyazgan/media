# Üretim yığını. Kök dizinden çalıştırın (deploy/*.sh betikleri bunu yapar):
#   docker compose --env-file .env -f deploy/docker-compose.prod.yml --profile selfhost up -d --build
# Mod A (önerilen, tek sunucu): --profile selfhost → web + Caddy (otomatik HTTPS) da bu sunucuda.
# Mod B (web Vercel'de): profil vermeyin ve deploy/docker-compose.vercel.yml dosyasını ekleyin (Postgres dışa açılır).
name: kaynak

x-app-env: &app-env
  DATABASE_URL: postgres://kaynak:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}@postgres:5432/kaynak
  REDIS_URL: redis://redis:6379
  STORAGE_DIR: /app/storage
  # resmigazete.gov.tr TÜBİTAK Kamu SM köküne dayanır; deploy/certs/kamusm.pem yoksa Node uyarı verip devam eder.
  NODE_EXTRA_CA_CERTS: /certs/kamusm.pem
  TZ: Europe/Istanbul

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaynak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
      POSTGRES_DB: kaynak
      TZ: Europe/Istanbul
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaynak -d kaynak"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ anahtar silinmesine tahammül etmez: noeviction şart.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    image: kaynak-worker:latest
    restart: unless-stopped
    env_file: ../.env
    environment: *app-env
    volumes:
      - storage:/app/storage
      - ./certs:/certs:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  web:
    profiles: ["selfhost"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        SITE_URL: ${SITE_URL:?SITE_URL .env içinde tanımlı olmalı}
        NEXT_PUBLIC_AD_PROVIDER: ${NEXT_PUBLIC_AD_PROVIDER:-}
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
        NEXT_PUBLIC_GAM_NETWORK: ${NEXT_PUBLIC_GAM_NETWORK:-}
        NEXT_PUBLIC_AD_UNITS: ${NEXT_PUBLIC_AD_UNITS:-}
    image: kaynak-web:latest
    restart: unless-stopped
    env_file: ../.env
    environment:
      <<: *app-env
      PORT: "3000"
    depends_on:
      postgres: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  caddy:
    profiles: ["selfhost"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN .env içinde tanımlı olmalı}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL .env içinde tanımlı olmalı}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Europe/Istanbul
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ../backups:/backups
      - storage:/storage:ro
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata: {}
  redisdata: {}
  storage: {}
  caddy_data: {}
  caddy_config: {}
