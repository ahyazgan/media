name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pnpm sürümü package.json#packageManager alanından okunur (iki yerde belirtmek hata verir)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  build-e2e:
    name: build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    env:
      DATABASE_URL: pglite://./data/kaynak
      SITE_URL: http://localhost:3100
      REVALIDATE_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      # pnpm sürümü package.json#packageManager alanından okunur (iki yerde belirtmek hata verir)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Örnek veri: fixture pipeline'ları (ağ ve API anahtarı gerekmez)
      - run: pnpm pipeline:run -- --fixture
      - run: pnpm pipeline:run -- --source kap --fixture
      - run: pnpm pipeline:run -- --calendar --fixture
      - name: web derlemesi (next/font ağ hatasına karşı 3 deneme)
        run: for i in 1 2 3; do pnpm --filter @kaynak/web build && exit 0; echo "[build] deneme $i başarısız (next/font Google Fonts erişimi olabilir), yeniden deneniyor"; sleep 15; done; exit 1
      - run: pnpm --filter @kaynak/web exec playwright install --with-deps chromium
      - run: pnpm --filter @kaynak/web e2e
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/test-results, retention-days: 7 }

  docker:
    name: docker imajları · compose doğrulama
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4
      # env_file: ../.env zorunlu; CI'da örnek dosyadan üretilir
      - run: cp .env.example .env && cat deploy/ci.env >> .env
      - name: compose yapılandırması (her iki mod)
        run: |
          docker compose --env-file .env -f deploy/docker-compose.prod.yml --profile selfhost config --quiet
          docker compose --env-file .env -f deploy/docker-compose.prod.yml -f deploy/docker-compose.vercel.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: worker imajı
        uses: docker/build-push-action@v6
        with: { context: ., file: apps/worker/Dockerfile, push: false, tags: "kaynak-worker:ci", load: true, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: web imajı
        uses: docker/build-push-action@v6
        with: { context: ., file: apps/web/Dockerfile, push: false, tags: "kaynak-web:ci", load: true, build-args: "SITE_URL=https://ci.example.com", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: imajlar açılıyor mu (duman testi)
        run: |
          docker network create kaynak-ci
          docker run -d --name pg --network kaynak-ci -e POSTGRES_USER=kaynak -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=kaynak postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U kaynak && break; sleep 2; done
          # Worker açılışta migration + seed yapar; ilk döngüyü görene kadar bekle, sonra durdur (ağ yok: kaynak hataları beklenir)
          docker run -d --name worker --network kaynak-ci -e DATABASE_URL=postgres://kaynak:ci@pg:5432/kaynak kaynak-worker:ci
          sleep 25; docker logs worker 2>&1 | tail -20
          docker exec pg psql -U kaynak -d kaynak -c "select id, enabled from sources order by id" | tee /tmp/sources.txt
          grep -q resmi-gazete /tmp/sources.txt
          docker run -d --name web --network kaynak-ci -p 3000:3000 -e DATABASE_URL=postgres://kaynak:ci@pg:5432/kaynak -e ADMIN_USER=ci -e ADMIN_PASSWORD=ci-sifre-123 kaynak-web:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
          curl -fsS http://localhost:3000/api/health | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "200"

  rehearsal:
    name: uçtan uca prova (Postgres + Redis + worker + web)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: kaynak, POSTGRES_PASSWORD: kaynak, POSTGRES_DB: kaynak }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kaynak" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://kaynak:kaynak@localhost:5432/kaynak
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: web derlemesi (veritabanısız, 3 deneme)
        run: for i in 1 2 3; do pnpm --filter @kaynak/web build && exit 0; echo "[build] deneme $i başarısız (next/font Google Fonts erişimi olabilir), yeniden deneniyor"; sleep 15; done; exit 1
        env: { DATABASE_URL: "pglite://memory", SITE_URL: "http://127.0.0.1:3100" }
      - run: pnpm rehearsal
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: prova-raporu, path: rehearsal-results, retention-days: 7 }
